<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IGLA — In-Game Leader AI</title>
  <!-- Crosshair mark, embedded so there's no favicon file to serve. -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e23636' stroke-width='2' stroke-linecap='round'%3E%3Ccircle cx='12' cy='12' r='7'/%3E%3Cline x1='12' y1='1.5' x2='12' y2='5'/%3E%3Cline x1='12' y1='19' x2='12' y2='22.5'/%3E%3Cline x1='1.5' y1='12' x2='5' y2='12'/%3E%3Cline x1='19' y1='12' x2='22.5' y2='12'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #0f1115;
      --sidebar-bg: #121419;
      --surface: #1a1d23;
      --surface-2: #2a2d35;
      --hover: #16191f;
      --modal-bg: #20242c;
      --code-bg: #12151b;
      --border: #333;
      --modal-border: #2f333b;
      --text: #e6e6e6;
      --text-heading: #c9ced3;
      --text-muted: #9aa0a6;
      --text-dim: #8b8f96;
      --accent: #e23636;
      --accent-strong: #d32f2f;
      --accent-strong-hover: #c92f2f;
      --on-accent: #fff;
      --link: #7fb0d4;
      --info-bg: #16232c;
      --info-border: #24404f;
      --danger-bg: #2c1a1c;
      --danger-border: #5a2a2e;
      --danger-border-soft: #3a2a2e;
      --danger-text: #e0777c;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden; /* the app owns its own scrolling */
    }

    /* form controls (palette unchanged) */
    label { display: block; margin: 16px 0 6px; color: var(--text-muted); font-size: 0.9rem; }
    select, input[type="text"], input[type="password"] {
      width: 100%; padding: 10px 12px; font-size: 1rem;
      background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 8px;
    }
    select:disabled { opacity: 0.5; }
    /* keep browser autofill on-theme (Chromium paints its own bg otherwise) */
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus {
      -webkit-text-fill-color: var(--text);
      -webkit-box-shadow: 0 0 0 1000px var(--surface) inset;
      caret-color: var(--text);
      transition: background-color 9999s ease-in-out 0s;
    }
    textarea {
      width: 100%; min-height: 44px; max-height: 200px; padding: 12px; font-size: 1rem;
      background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 8px;
      resize: none; font-family: inherit;
    }
    button {
      padding: 10px 20px; font-size: 1rem; background: var(--accent-strong); color: var(--on-accent);
      border: none; border-radius: 8px; cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary { background: var(--surface-2); }
    button.small { padding: 6px 14px; font-size: 0.9rem; }
    button.full { width: 100%; }

    /* ---------- LOGIN (centered in viewport) ---------- */
    #login-panel {
      height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 24px;
    }
    #login-card { width: 100%; max-width: 380px; }
    #login-card h1 { font-size: 1.4rem; margin-bottom: 4px; }
    #login-card p { color: var(--text-muted); margin-top: 0; }
    .auth-actions { display: flex; gap: 8px; margin-top: 16px; }
    .auth-actions button { flex: 1; }
    #auth-msg { margin-top: 12px; min-height: 20px; color: var(--danger-text); font-size: 0.9rem; }

    /* ---------- APP SHELL ---------- */
    #app-panel { height: 100vh; display: flex; }

    /* sidebar */
    #sidebar {
      width: 240px; flex-shrink: 0; height: 100vh;
      display: flex; flex-direction: column;
      background: var(--sidebar-bg); border-right: 1px solid var(--surface-2);
      transition: width 0.15s ease;
    }
    #sidebar.collapsed { width: 60px; }
    .sidebar-top { padding: 14px 10px 8px; }
    .sidebar-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 10px; }
    .sidebar-bottom { padding: 8px 10px 14px; border-top: 1px solid var(--surface-2); }
    .sidebar-top .full.small { margin-bottom: 6px; }

    .sidebar-head {
      display: flex; align-items: center; justify-content: space-between;
      height: 28px; margin-bottom: 12px;
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 1.1rem; }
    .brand-mark { width: 20px; height: 20px; flex-shrink: 0; }

    .icon-btn {
      background: none; border: none; padding: 6px; margin: 0; cursor: pointer;
      color: var(--text-muted); border-radius: 6px; display: inline-flex; align-items: center; justify-content: center;
    }
    .icon-btn:hover { background: var(--hover); color: var(--text); }
    .icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .nav-item {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 8px 10px; margin: 0 0 6px; border-radius: 8px;
      background: none; border: 1px solid transparent; color: var(--text);
      font-size: 0.9rem; cursor: pointer; text-align: left;
    }
    .nav-item:hover { background: var(--hover); }
    .nav-item.primary { background: var(--accent-strong); color: var(--on-accent); justify-content: center; border: none; }
    .nav-item.primary:hover { background: var(--accent-strong-hover); }
    .nav-icon { width: 18px; height: 18px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .collapsed-only { display: none; }
    .whoami-line { color: var(--text-muted); font-size: 0.8rem; margin-bottom: 8px; padding: 0 2px; }
    .sidebar-label { color: var(--text-dim); font-size: 0.72rem; margin: 14px 0 6px; text-transform: uppercase; letter-spacing: 0.04em; }

    /* collapsed: hide labels/wordmark/lists, show rail icons, center everything */
    #sidebar.collapsed .nav-label,
    #sidebar.collapsed .brand,
    #sidebar.collapsed .expanded-only { display: none !important; }
    #sidebar.collapsed .collapsed-only { display: flex; }
    #sidebar.collapsed .nav-item { justify-content: center; gap: 0; padding: 8px; }
    #sidebar.collapsed .sidebar-head { justify-content: center; }

    .thread-item { padding: 8px 10px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
    .thread-item:hover { background: var(--hover); }
    .thread-item.active { background: var(--surface); border-color: var(--border); }
    .thread-title { font-size: 0.85rem; }
    .thread-meta { font-size: 0.75rem; color: var(--text-dim); margin-top: 2px; }

    input[type="file"] { width: 100%; font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }
    input[type="file"]::file-selector-button { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; margin-right: 8px; cursor: pointer; font-size: 0.85rem; }
    #upload-msg { font-size: 0.8rem; color: var(--text-muted); min-height: 16px; margin-top: 6px; }
    #note-list { margin-top: 8px; }
    .note-empty { color: var(--text-dim); font-size: 0.8rem; padding: 8px 10px; }
    .note-item { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; padding: 8px 10px; border-radius: 6px; border: 1px solid transparent; }
    .note-item:hover { background: var(--hover); }
    .note-info { min-width: 0; }
    .note-name { font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .note-meta { font-size: 0.75rem; color: var(--text-dim); margin-top: 2px; }
    .note-del { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 1rem; line-height: 1; margin: 0; padding: 2px 4px; flex-shrink: 0; }
    .note-del:hover { color: var(--accent); }

    /* ---------- MAIN ---------- */
    #main { flex: 1; min-width: 0; height: 100vh; display: flex; flex-direction: column; }
    #empty-state { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-dim); }
    #empty-state { flex-direction: column; gap: 6px; text-align: center; padding: 24px; }
    .empty-greeting { color: var(--text); font-size: 1.05rem; }
    .empty-hint { color: var(--text-dim); font-size: 0.9rem; }
    #thread-view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    #thread-header {
      flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--surface-2);
    }
    #thread-title { font-size: 0.98rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badge { background: var(--badge-bg, var(--surface-2)); color: var(--badge-fg, var(--text-muted)); border: 1px solid var(--badge-border, transparent); font-size: 0.75rem; padding: 3px 10px; border-radius: 6px; flex-shrink: 0; }

    #messages-scroll { flex: 1; min-height: 0; overflow-y: auto; }
    #messages { max-width: 720px; margin: 0 auto; padding: 24px 20px; display: flex; flex-direction: column; gap: 12px; }
    .bubble { max-width: 82%; padding: 10px 14px; border-radius: 10px; white-space: pre-wrap; font-size: 0.92rem; line-height: 1.55; }
    .bubble.user { align-self: flex-end; background: var(--surface-2); }
    .bubble.assistant { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); }
    .bubble.rejected { background: var(--danger-bg); border-color: var(--danger-border); color: var(--danger-text); }
    .origin-tag { display: inline-block; margin-top: 8px; font-size: 0.72rem; color: var(--link); background: var(--info-bg); border: 1px solid var(--info-border); padding: 2px 8px; border-radius: 6px; }

    /* assistant markdown body — rendered as real nodes, never innerHTML */
    .bubble .md { white-space: normal; }
    .bubble .md > :first-child { margin-top: 0; }
    .bubble .md > :last-child { margin-bottom: 0; }
    .bubble .md p { margin: 0 0 8px; }
    .bubble .md ul, .bubble .md ol { margin: 6px 0; padding-left: 22px; }
    .bubble .md li { margin: 2px 0; }
    .bubble .md h3, .bubble .md h4, .bubble .md h5, .bubble .md h6 { margin: 10px 0 6px; line-height: 1.3; font-weight: 650; }
    .bubble .md h3 { font-size: 1.02rem; }
    .bubble .md h4 { font-size: 0.98rem; }
    .bubble .md h5, .bubble .md h6 { font-size: 0.92rem; color: var(--text-heading); }
    .bubble .md code { background: var(--code-bg); border: 1px solid var(--surface-2); border-radius: 4px; padding: 1px 5px; font-size: 0.86em; font-family: ui-monospace, Consolas, monospace; }
    .bubble .md a { color: var(--link); text-decoration: underline; }
    .loader-dots { display: inline-flex; gap: 5px; padding: 2px 0; }
    .loader-dots span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--text-dim);
      animation: loaderDot 1.1s infinite;
    }
    .loader-dots span:nth-child(2) { animation-delay: 0.18s; }
    .loader-dots span:nth-child(3) { animation-delay: 0.36s; }
    @keyframes loaderDot {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.3; }
      40% { transform: translateY(-5px); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .loader-dots span { animation-duration: 0.001s; opacity: 0.7; }
    }

    .composer-wrap { flex-shrink: 0; border-top: 1px solid var(--surface-2); padding: 12px 20px; }
    .composer-row { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
    .composer-row button { flex-shrink: 0; }
    /* ---------- TEAM-INSTRUCTIONS MODAL ---------- */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(0, 0, 0, 0.55);
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .modal-card {
      width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto;
      background: var(--modal-bg); border: 1px solid var(--modal-border); border-radius: 14px;
      padding: 18px 24px 22px;
    }
    .modal-head { display: flex; align-items: center; justify-content: space-between; }
    .modal-title { font-size: 1.15rem; font-weight: 600; }
    #instr-text { min-height: 150px; max-height: 45vh; }
    .instr-counter { text-align: right; color: var(--text-dim); font-size: 0.8rem; margin-top: 6px; }
    .instr-counter.over { color: var(--danger-text); }
    #instr-msg { min-height: 16px; margin-top: 8px; color: var(--danger-text); font-size: 0.8rem; }
    .modal-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; }
    .modal-foot-right { display: flex; gap: 10px; }
    button.danger { background: transparent; border: 1px solid var(--danger-border-soft); color: var(--danger-text); }
    button.danger:hover { background: var(--danger-bg); }
  </style>
</head>
<body>
  <!-- State 1 — login, centered in the viewport. -->
  <div id="login-panel" style="display: none;">
    <div id="login-card">
      <h1>IGLA — In-Game Leader AI</h1>
      <p>Sign in, or create an account, to get tactical reads.</p>
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" />
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" />
      <div class="auth-actions">
        <button id="login-btn">Log in</button>
        <button id="register-btn" class="secondary">Create account</button>
      </div>
      <div id="auth-msg"></div>
    </div>
  </div>

  <!-- States 2 & 3 — the app shell. -->
  <div id="app-panel" style="display: none;">
    <aside id="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-head">
          <span class="brand">
            <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="#e23636" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><line x1="12" y1="1.5" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22.5" y2="12"/></svg>
            <span>IGLA</span>
          </span>
          <button id="collapse-btn" class="icon-btn" title="Toggle sidebar" aria-label="Toggle sidebar">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
          </button>
        </div>

        <button id="new-thread-btn" class="nav-item primary">
          <svg class="nav-icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span class="nav-label">New thread</span>
        </button>
        <div id="new-thread-form" class="expanded-only" style="display: none;">
          <label for="team">Opponent</label>
          <select id="team" disabled>
            <option value="">Loading teams…</option>
          </select>
          <div class="auth-actions">
            <button id="create-thread-btn" class="small">Create</button>
            <button id="cancel-thread-btn" class="secondary small">Cancel</button>
          </div>
        </div>

        <button id="add-note-btn" class="full secondary small expanded-only">+ Add note</button>
        <div id="upload-form" class="expanded-only" style="display: none;">
          <label for="upload-file">File (.txt or .md)</label>
          <input id="upload-file" type="file" accept=".txt,.md" />
          <label for="upload-team">About opponent</label>
          <select id="upload-team" disabled>
            <option value="">Loading teams…</option>
          </select>
          <div class="auth-actions">
            <button id="upload-btn" class="small">Upload</button>
            <button id="cancel-upload-btn" class="secondary small">Cancel</button>
          </div>
          <div id="upload-msg"></div>
        </div>

        <button id="sidebar-instr-btn" class="full secondary small expanded-only">+ Team instructions</button>

        <!-- visible only when collapsed: tap to expand back to the lists -->
        <button id="rail-threads" class="nav-item collapsed-only" title="Threads" aria-label="Threads">
          <svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        </button>
        <button id="rail-notes" class="nav-item collapsed-only" title="My notes" aria-label="My notes">
          <svg class="nav-icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        </button>
      </div>

      <div class="sidebar-scroll">
        <div class="expanded-only">
          <div class="sidebar-label">Recent</div>
          <div id="thread-list"></div>
        </div>

        <div class="expanded-only">
          <div class="sidebar-label">My notes</div>
          <div id="note-list"></div>
        </div>
      </div>

      <div class="sidebar-bottom">
        <div class="whoami-line expanded-only">Signed in as <span id="whoami"></span></div>
        <button id="logout-btn" class="nav-item" title="Log out">
          <svg class="nav-icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span class="nav-label">Log out</span>
        </button>
      </div>
    </aside>

    <main id="main">
      <div id="empty-state" style="display: none;">
        <p>Pick a thread, or start a new one.</p>
      </div>

      <div id="thread-view" style="display: none;">
        <div id="thread-header">
          <span id="thread-title"></span>
          <span style="display: flex; align-items: center; gap: 10px; flex-shrink: 0;">
            <button id="thread-instr-btn" class="small secondary" style="display: inline-flex; align-items: center; gap: 6px;">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
              Instructions
            </button>
            <span id="thread-team" class="badge"></span>
          </span>
        </div>
        <div id="messages-scroll">
          <div id="messages"></div>
        </div>
        <div class="composer-wrap">
          <div class="composer-row">
            <textarea id="message-box" placeholder="Ask a follow-up… (Enter to send)"></textarea>
            <button id="send-btn">Send</button>
          </div>
        </div>
      </div>
    </main>

    <div id="instr-modal" class="modal-backdrop" style="display: none;">
      <div class="modal-card">
        <div class="modal-head">
          <span class="modal-title">Team instructions</span>
          <button id="instr-close" class="icon-btn" title="Close" aria-label="Close">
            <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <label for="instr-team">Opponent</label>
        <select id="instr-team" disabled>
          <option value="">Loading teams…</option>
        </select>
        <label for="instr-text">Instruction</label>
        <textarea id="instr-text" placeholder="Standing guidance for this opponent — applied to every answer in their threads."></textarea>
        <div id="instr-counter" class="instr-counter"><span id="instr-count">0</span> / 2000</div>
        <div id="instr-msg"></div>
        <div class="modal-foot">
          <button id="instr-clear" class="danger">Clear</button>
          <span class="modal-foot-right">
            <button id="instr-cancel" class="secondary">Cancel</button>
            <button id="instr-save">Save</button>
          </span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "";
    const BASE_TITLE = "IGLA — In-Game Leader AI";

    const loginPanel = document.getElementById("login-panel");
    const appPanel = document.getElementById("app-panel");
    const authMsg = document.getElementById("auth-msg");
    const whoami = document.getElementById("whoami");

    const usernameBox = document.getElementById("username");
    const passwordBox = document.getElementById("password");
    const loginBtn = document.getElementById("login-btn");
    const registerBtn = document.getElementById("register-btn");
    const logoutBtn = document.getElementById("logout-btn");

    // shell
    const sidebar = document.getElementById("sidebar");
    const collapseBtn = document.getElementById("collapse-btn");
    const railThreads = document.getElementById("rail-threads");
    const railNotes = document.getElementById("rail-notes");
    const SIDEBAR_KEY = "igla_sidebar_collapsed";

    const newThreadBtn = document.getElementById("new-thread-btn");
    const newThreadForm = document.getElementById("new-thread-form");
    const createThreadBtn = document.getElementById("create-thread-btn");
    const cancelThreadBtn = document.getElementById("cancel-thread-btn");
    const teamSelect = document.getElementById("team");
    const threadList = document.getElementById("thread-list");

    const addNoteBtn = document.getElementById("add-note-btn");
    const uploadForm = document.getElementById("upload-form");
    const uploadFile = document.getElementById("upload-file");
    const uploadTeamSelect = document.getElementById("upload-team");

    // --- Sidebar collapse (persisted; index.html is a real page, so localStorage is fine) ---
    function setCollapsed(collapsed) {
      sidebar.classList.toggle("collapsed", collapsed);
      try { localStorage.setItem(SIDEBAR_KEY, collapsed ? "1" : "0"); } catch (e) {}
    }
    function collapseSidebar() {
      // close open forms so they don't reappear on re-expand
      newThreadForm.style.display = "none";
      uploadForm.style.display = "none";
      setCollapsed(true);
    }
    function expandSidebar() { setCollapsed(false); }
    collapseBtn.addEventListener("click", () => {
      sidebar.classList.contains("collapsed") ? expandSidebar() : collapseSidebar();
    });
    railThreads.addEventListener("click", expandSidebar);
    railNotes.addEventListener("click", expandSidebar);
    function restoreSidebar() {
      let collapsed = false;
      try { collapsed = localStorage.getItem(SIDEBAR_KEY) === "1"; } catch (e) {}
      sidebar.classList.toggle("collapsed", collapsed);
    }

    // Tab title tracks the open thread; also gives the tab-hover tooltip for free.
    function setTitle(thread) { document.title = thread ? `IGLA — ${thread}` : BASE_TITLE; }

    function scrollMessagesToBottom() { messagesScroll.scrollTop = messagesScroll.scrollHeight; }

    function errorText(payload, status) {
      const detail = payload?.detail;
      if (typeof detail === "string") return detail;
      if (Array.isArray(detail)) return detail[0]?.msg ?? `Error ${status}`;
      return `Error ${status}`;
    }

    function relativeTime(iso) {
      const mins = Math.floor((Date.now() - new Date(iso)) / 60000);
      if (mins < 1) return "just now";
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs}h ago`;
      return `${Math.floor(hrs / 24)}d ago`;
    }

    async function authedFetch(path, options) {
      const res = await fetch(`${API_BASE}${path}`, options);
      if (res.status === 401) { showLogin(); return null; }
      return res;
    }

    function showApp(username) {
      loginPanel.style.display = "none";
      appPanel.style.display = "flex";
      currentUsername = username;
      whoami.textContent = username;
      restoreSidebar();
      loadTeams();
      loadThreads();
      loadUploads();
      showEmpty();

    function showLogin() {
      appPanel.style.display = "none";

      setTitle(null);

      emptyState.textContent = "";
      const greeting = document.createElement("div");
      greeting.className = "empty-greeting";
      greeting.textContent = currentUsername

      const hint = document.createElement("div");
      hint.className = "empty-hint";
      hint.textContent = "Pick a thread, or start a new one.";
      emptyState.append(greeting, hint);
      threadView.style.display = "none";

      currentAnchorTeamId = null;

    async function checkAuth() {
      try {
        const res = await fetch(`${API_BASE}/auth/me`);
        if (res.ok) { const data = await res.json(); showApp(data.username); }
        else { showLogin(); }
      } catch (err) { showLogin(); }
    }

    async function doLogin(username, password) {
      authMsg.textContent = "";
      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });
        if (res.ok) { const data = await res.json(); showApp(data.username); return; }
        const payload = await res.json().catch(() => null);
        authMsg.textContent = errorText(payload, res.status);
      } catch (err) { authMsg.textContent = `Request failed: ${err.message}`; }
    }

    function attemptLogin() {
      const username = usernameBox.value.trim();
      const password = passwordBox.value;
      if (!username || !password) { authMsg.textContent = "Enter a username and password."; return; }
      doLogin(username, password);
    }
    loginBtn.addEventListener("click", attemptLogin);
    [usernameBox, passwordBox].forEach((el) =>
      el.addEventListener("keydown", (e) => { if (e.key === "Enter") attemptLogin(); })
    );

      const username = usernameBox.value.trim();
      const password = passwordBox.value;
      if (!username || !password) { authMsg.textContent = "Enter a username and password."; return; }
      authMsg.textContent = "";
      try {
        const res = await fetch(`${API_BASE}/auth/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),

        const payload = await res.json().catch(() => null);

    async function loadTeams() {
      try {
        const res = await fetch(`${API_BASE}/teams`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        teamSelect.innerHTML = "";
        uploadTeamSelect.innerHTML = "";
        instrTeamSelect.innerHTML = '<option value="">Choose an opponent…</option>';
        for (const team of data.teams) {
          teamNames[team.team_id] = team.name;
          const label = `${team.name} — ${team.region}`;
          const t = document.createElement("option");
          t.value = team.team_id; t.textContent = label; teamSelect.appendChild(t);
          const u = document.createElement("option");
          u.value = team.team_id; u.textContent = label; uploadTeamSelect.appendChild(u);
          const n = document.createElement("option");
          n.value = team.team_id; n.textContent = label; instrTeamSelect.appendChild(n);
        }
        teamSelect.disabled = false;
        uploadTeamSelect.disabled = false;

      const res = await authedFetch("/conversations");
      if (!res || !res.ok) return;
      const data = await res.json();
      threadList.innerHTML = "";
      for (const conv of data.conversations) {
        const item = document.createElement("div");
        item.className = "thread-item";
        if (conv.id === currentConversationId) item.classList.add("active");
        const title = document.createElement("div");
        title.className = "thread-title";
        title.textContent = conv.title ?? "New thread";
        const meta = document.createElement("div");
        meta.className = "thread-meta";
        const name = teamNames[conv.team_id] ?? conv.team_id;
        meta.textContent = `${name} · ${relativeTime(conv.updated_at)}`;
        item.append(title, meta);
        item.addEventListener("click", () => openThread(conv.id));
        threadList.appendChild(item);
      }

      const res = await authedFetch("/uploads");
      if (!res || !res.ok) return;
      const uploads = await res.json();
      noteList.innerHTML = "";

        empty.className = "note-empty";

        return;

      for (const note of uploads) {
        const item = document.createElement("div");
        item.className = "note-item";
        const info = document.createElement("div");
        info.className = "note-info";
        const name = document.createElement("div");
        name.className = "note-name";
        name.textContent = note.source;
        name.title = note.source;
        const meta = document.createElement("div");
        meta.className = "note-meta";
        const teamName = teamNames[note.team_id] ?? note.team_id;
        const chunkLabel = note.chunks === 1 ? "1 chunk" : `${note.chunks} chunks`;

    // ---- Markdown -> real DOM. Text goes through textContent (the DOM escapes
    // it), so retrieved-doc or injected markup can't become live HTML. Links
    // are gated to http(s) only. No innerHTML anywhere by construction. ----
    function mdParseInline(text) {
      const nodes = [];
      const re = /(\*\*(.+?)\*\*)|(`([^`]+?)`)|(\*(.+?)\*)|(_(.+?)_)|(\[([^\]]+?)\]\((\S+?)\))/g;
      let last = 0, m;
      while ((m = re.exec(text)) !== null) {
        if (m.index > last) nodes.push({ t: "text", v: text.slice(last, m.index) });
        if (m[1] !== undefined) nodes.push({ t: "strong", v: m[2] });
        else if (m[3] !== undefined) nodes.push({ t: "code", v: m[4] });
        else if (m[5] !== undefined) nodes.push({ t: "em", v: m[6] });
        else if (m[7] !== undefined) nodes.push({ t: "em", v: m[8] });
        else if (m[9] !== undefined) {
          const href = m[11], label = m[10];
          if (/^https?:\/\//i.test(href)) nodes.push({ t: "link", href, v: label });
          else nodes.push({ t: "text", v: m[9] });   // bad scheme -> literal text
        }
        last = re.lastIndex;
      }
      if (last < text.length) nodes.push({ t: "text", v: text.slice(last) });
      return nodes;
    }

    function mdInlineInto(text, parent) {
      for (const node of mdParseInline(text)) {
        if (node.t === "text") parent.appendChild(document.createTextNode(node.v));
        else if (node.t === "strong") { const e = document.createElement("strong"); e.textContent = node.v; parent.appendChild(e); }
        else if (node.t === "em")     { const e = document.createElement("em");     e.textContent = node.v; parent.appendChild(e); }
        else if (node.t === "code")   { const e = document.createElement("code");   e.textContent = node.v; parent.appendChild(e); }
        else if (node.t === "link") {
          const a = document.createElement("a");
          a.href = node.href; a.textContent = node.v;
          a.target = "_blank"; a.rel = "noopener noreferrer";
          parent.appendChild(a);
        }
      }
    }

    function renderMarkdownInto(container, text) {
      const lines = String(text ?? "").replace(/\r\n?/g, "\n").split("\n");
      const ul = /^\s*[-*+]\s+(.*)$/, ol = /^\s*\d+\.\s+(.*)$/;
      const md = document.createElement("div");
      md.className = "md";
      let i = 0;
      while (i < lines.length) {
        const line = lines[i];
        if (line.trim() === "") { i++; continue; }
        const h = /^(#{1,6})\s+(.*)$/.exec(line);
        if (h) {
          const lvl = Math.min(6, Math.max(3, h[1].length + 2)); // # -> h3, ## -> h4 ...
          const el = document.createElement("h" + lvl);
          mdInlineInto(h[2], el); md.appendChild(el); i++; continue;
        }
        if (ul.test(line) || ol.test(line)) {
          const ordered = ol.test(line), rx = ordered ? ol : ul;
          const list = document.createElement(ordered ? "ol" : "ul");
          while (i < lines.length && rx.test(lines[i])) {
            const li = document.createElement("li");
            mdInlineInto(rx.exec(lines[i])[1], li); list.appendChild(li); i++;
          }
          md.appendChild(list); continue;
        }
        const p = document.createElement("p");
        let first = true;
        while (i < lines.length && lines[i].trim() !== "" &&
               !/^(#{1,6})\s+/.test(lines[i]) && !ul.test(lines[i]) && !ol.test(lines[i])) {
          if (!first) p.appendChild(document.createElement("br"));
          mdInlineInto(lines[i], p); first = false; i++;
        }
        md.appendChild(p);
      }
      container.appendChild(md);
    }

    function appendPendingBubble() {
      const bubble = document.createElement("div");
      bubble.className = "bubble assistant";
      const dots = document.createElement("div");
      dots.className = "loader-dots";
      dots.append(document.createElement("span"), document.createElement("span"), document.createElement("span"));
      bubble.appendChild(dots);
      messagesBox.appendChild(bubble);
      return bubble;
    }

    function appendBubble(role, content, rejected) {
      const bubble = document.createElement("div");
      bubble.className = `bubble ${role}`;
      if (rejected) bubble.classList.add("rejected");
      if (role === "assistant") renderMarkdownInto(bubble, content);
      else bubble.textContent = content;
      messagesBox.appendChild(bubble);
      return bubble;
    }

    function applyOriginTag(bubble, origins) {
      if (!origins || !origins.includes("upload")) return;
      const tag = document.createElement("div");
      tag.className = "origin-tag";
      tag.textContent = "Includes your uploaded notes";
      bubble.appendChild(tag);
    }

    function renderMessages(messages) {
      messagesBox.innerHTML = "";
      let lastUserGate = null;
      for (const m of messages) {
        if (m.role === "user") lastUserGate = m.gate;
        const rejected = m.role === "assistant" && lastUserGate === "reject";
        const bubble = appendBubble(m.role, m.content, rejected);
        if (m.role === "assistant") applyOriginTag(bubble, m.origins);
      }
    }

    // Per-team accent: hash the team name to a hue, tint the badge from it.
    // Verified AA across all 360 hues (min 5.86:1), so the team name stays legible.
    function hueForTeam(name) {
      let h = 0;
      for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
      return h % 360;
    }
    function setTeamBadge(name) {
      threadTeam.textContent = name;
      const h = hueForTeam(name);
      threadTeam.style.setProperty("--badge-bg", `hsl(${h} 38% 17%)`);
      threadTeam.style.setProperty("--badge-fg", `hsl(${h} 58% 73%)`);
      threadTeam.style.setProperty("--badge-border", `hsl(${h} 32% 30%)`);
    }

    async function openThread(id) {
      const res = await authedFetch(`/conversations/${id}`);
      if (!res) return;
      if (!res.ok) { showEmpty(); loadThreads(); return; }
      const conv = await res.json();
      currentConversationId = conv.id;
      const title = conv.title ?? "New thread";
      threadTitle.textContent = title;
      setTeamBadge(teamNames[conv.current_team_id] ?? conv.current_team_id);
      currentAnchorTeamId = conv.current_team_id;
      setTitle(title);
      renderMessages(conv.messages);
      const teamLabel = teamNames[conv.current_team_id] ?? "this opponent";
      messageBox.placeholder = conv.messages.length
        ? "Ask a follow-up… (Enter to send)"
        : `Ask about ${teamLabel}…`;
      emptyState.style.display = "none";
      threadView.style.display = "flex";
      newThreadForm.style.display = "none";
      loadThreads();
      scrollMessagesToBottom();
      messageBox.focus();
    }

    createThreadBtn.addEventListener("click", async () => {
      const teamId = Number(teamSelect.value);
      if (!teamId) return;
      createThreadBtn.disabled = true;
      try {
        const res = await authedFetch("/conversations", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ team_id: teamId }),
        });
        if (!res) return;
        if (!res.ok) {
          const payload = await res.json().catch(() => null);
          alert(errorText(payload, res.status));
          return;
        }
        const conv = await res.json();
        newThreadForm.style.display = "none";
        await openThread(conv.id);
      } finally {
        createThreadBtn.disabled = false;
      }
    });

    async function sendMessage() {
      const message = messageBox.value.trim();
      if (!message || !currentConversationId) return;
      appendBubble("user", message, false);
      messageBox.value = "";
      sendBtn.disabled = true;
      const pending = appendPendingBubble();
      scrollMessagesToBottom();
      try {
        const res = await authedFetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ conversation_id: currentConversationId, message: message }),
        });
        if (!res) return;
        if (!res.ok) {
          const payload = await res.json().catch(() => null);
          pending.textContent = `Error ${res.status}: ${errorText(payload, res.status)}`;
          pending.classList.add("rejected");
          return;
        }
        const data = await res.json();
        pending.textContent = "";
        renderMarkdownInto(pending, data.response);
        applyOriginTag(pending, data.origins);
        if (data.gate === "reject") pending.classList.add("rejected");
        if (data.team_id) {
          setTeamBadge(teamNames[data.team_id] ?? data.team_id);
          currentAnchorTeamId = data.team_id;
        }
        loadThreads();
      } catch (err) {
        pending.textContent = `Request failed: ${err.message}`;
        pending.classList.add("rejected");
      } finally {
        sendBtn.disabled = false;
        scrollMessagesToBottom();
        messageBox.focus();
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    messageBox.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    // --- Team-instructions modal (opened from the sidebar or the thread header) ---
    function updateInstrCounter() {
      const n = instrText.value.length;
      instrCount.textContent = n;
      instrCounter.classList.toggle("over", n > 2000);
    }

    async function loadInstruction(teamId) {
      instrText.value = "";
      instrMsg.textContent = "";
      updateInstrCounter();
      if (!teamId) return; // no opponent chosen yet -> empty editor
      const res = await authedFetch(`/instructions/${teamId}`);
      if (!res || !res.ok) return;
      const data = await res.json();
      instrText.value = data.instructions_text || "";
      updateInstrCounter();
    }

    function openInstrModal(teamId) {
      instrMsg.textContent = "";
      instrTeamSelect.value = teamId ? String(teamId) : "";
      instrModal.style.display = "flex";
      loadInstruction(teamId);

    instrTeamSelect.addEventListener("change", () =>

    instrCloseBtn.addEventListener("click", closeInstrModal);
    instrCancelBtn.addEventListener("click", closeInstrModal);
    instrModal.addEventListener("click", (e) => {
      if (e.target === instrModal) closeInstrModal(); // click the backdrop to close

    document.addEventListener("keydown", (e) => {

    });

    instrSaveBtn.addEventListener("click", async () => {
      const teamId = Number(instrTeamSelect.value);
      if (!teamId) { instrMsg.textContent = "Choose an opponent."; return; }
      const text = instrText.value.trim();
      if (!text) { instrMsg.textContent = "Instruction must not be blank."; return; }
      instrMsg.textContent = "";
      instrSaveBtn.disabled = true;
      try {
        const res = await authedFetch(`/instructions/${teamId}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ instructions_text: text }),
        });
        if (!res) return;
        if (!res.ok) {
          const payload = await res.json().catch(() => null);
          instrMsg.textContent = errorText(payload, res.status);
          return;
        }
        closeInstrModal();
      } catch (err) {
        instrMsg.textContent = `Request failed: ${err.message}`;
      } finally {
        instrSaveBtn.disabled = false;
      }
    });

    instrClearBtn.addEventListener("click", async () => {
      const teamId = Number(instrTeamSelect.value);
      if (!teamId) { instrMsg.textContent = "Choose an opponent."; return; }
      if (instrText.value.trim() && !confirm("Clear this opponent's instruction?")) return;
      instrMsg.textContent = "";
      instrClearBtn.disabled = true;
      try {
        // 204 removed or 404 nothing-to-remove: both end at "cleared".
        const res = await authedFetch(`/instructions/${teamId}`, { method: "DELETE" });
        if (!res) return;
        instrText.value = "";
        updateInstrCounter();
        closeInstrModal();
      } catch (err) {
        instrMsg.textContent = `Request failed: ${err.message}`;
      } finally {
        instrClearBtn.disabled = false;
      }
    });

    checkAuth();
  </script>
</body>
</html>
